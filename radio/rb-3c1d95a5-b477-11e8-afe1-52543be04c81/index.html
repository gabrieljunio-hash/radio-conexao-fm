  <div class="station-player-toolbar"><button type="button" id="closeStationPlayer">← Voltar à rádio</button><span>Player Conexão FM</span></div>
  <iframe class="station-player-frame" id="stationPlayerFrame" title="Player da Conexão FM" allow="autoplay"></iframe>
</section>
<script>
(function(){
  const button=document.querySelector("[data-open-station-player]");
  const overlay=document.getElementById("stationPlayerOverlay");
  const frame=document.getElementById("stationPlayerFrame");
  const close=document.getElementById("closeStationPlayer");
  if(!button||!overlay||!frame||!close)return;
  button.addEventListener("click",function(){
    const id=button.getAttribute("data-station-id");
    overlay.hidden=false;
    document.body.style.overflow="hidden";
    frame.src="/?station="+encodeURIComponent(id)+"&autoplay=1&openPlayer=1";
  });
  function closePlayer(){
    overlay.hidden=true;
    frame.src="about:blank";
    document.body.style.overflow="";
  }
  close.addEventListener("click",closePlayer);
  document.addEventListener("keydown",event=>{if(event.key==="Escape"&&!overlay.hidden)closePlayer()});
})();
</script>
