name: Admin preview smoke test

on:
  push:
    branches:
      - fix/d1-import-small-batches
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Cloudflare Pages branch preview
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://fix-d1-import-small-batches.radio-conexao-fm.pages.dev/admin.html >/dev/null; then
              echo "Admin preview is responding"
              exit 0
            fi
            echo "Waiting for Pages Preview ($i/30)"
            sleep 20
          done
          echo "Admin preview did not become available"
          exit 1
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test protected admin page on live Preview
        env:
          CI: true
          PREVIEW_BASE_URL: https://fix-d1-import-small-batches.radio-conexao-fm.pages.dev
        run: npx playwright test tests/site.spec.js -g "painel administrativo"
