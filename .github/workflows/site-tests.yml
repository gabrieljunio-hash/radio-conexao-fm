name: Site tests

on:
  push:
    branches:
      - feature/monetization-stage5
      - fix/universal-audience-tracking-stage5
  pull_request:
    branches:
      - main
      - feature/home-recent-popular-stage1
      - integration/monetization-stage5-main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Worker API
        run: node --test api/tests/worker.test.mjs
      - name: Validate Wrangler config and Worker bundle without deploying
        run: npx --yes wrangler@latest deploy --dry-run --config api/wrangler.toml
      - name: Validate full D1 import migration
        run: python3 tests/d1-migration.test.py
      - name: Validate sponsored campaign migration
        run: python3 tests/sponsored-campaigns-migration.test.py
      - name: Validate external audience migration
        run: python3 tests/external-audience-migration.test.py
      - name: Install test dependencies
        run: npm install --no-save @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run browser tests
        run: npx playwright test tests/site.spec.js
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
