name: Radio stream health check

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/radio-health.yml"
      - "scripts/check_radios.py"

permissions:
  contents: write

concurrency:
  group: radio-health-check
  cancel-in-progress: false

jobs:
  check-streams:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check radio streams and update JSON
        run: python scripts/check_radios.py
      - name: Commit status JSON if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/radio-status.json
          if git diff --cached --quiet; then
            echo "No status changes to commit."
          else
            git commit -m "Update radio stream health status"
            git push
          fi
