name: Generate static radio SEO pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "scripts/generate-radio-pages.mjs"
      - ".github/workflows/static-radio-pages.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  pull_request:
    paths:
      - "scripts/**"
      - "index.html"
      - "sitemap.xml"
      - ".github/workflows/static-radio-pages.yml"

permissions:
  contents: write

concurrency:
  group: static-radio-seo-pages
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test generator
        run: node --test scripts/*.test.mjs

  generate:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || 'main' }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate pages from D1 catalog API
        run: node scripts/generate-radio-pages.mjs
      - name: Commit generated pages and sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radio/ sitemap.xml
          if git diff --cached --quiet; then
            echo "Nenhuma página nova ou alterada."
          else
            git commit -m "chore: refresh static radio SEO pages"
            git push origin "${GITHUB_HEAD_REF:-main}"
          fi
