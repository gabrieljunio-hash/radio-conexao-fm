name: Generate static radio SEO pages

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "index.html"
      - "sitemap.xml"
      - ".github/workflows/static-radio-pages.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  pull_request:
    paths:
      - "scripts/**"
      - "index.html"
      - "sitemap.xml"
      - ".github/workflows/static-radio-pages.yml"

permissions:
  contents: read

concurrency:
  group: static-radio-seo-tests
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test generator
        run: node --test scripts/*.test.mjs
