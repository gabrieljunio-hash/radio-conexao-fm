name: Regenerate radio SEO pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/regenerate-radio-pages.yml"
      - "scripts/generate-radio-pages.mjs"
      - "index.html"
      - "radio.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radio-seo-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate radio pages and sitemap
        run: node scripts/generate-radio-pages.mjs
      - name: Publish generated pages to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radio sitemap.xml
          if git diff --cached --quiet; then
            echo "No radio pages changed."
          else
            git commit -m "Refresh radio SEO pages and official information"
            git push
          fi
