name = "radio-conexao-api"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "radio-conexao-db"
database_id = "cfcac14d-6938-46e7-a387-479bae5019e5"
migrations_dir = "migrations"

[previews]

[[previews.d1_databases]]
binding = "DB"
database_id = "cfcac14d-6938-46e7-a387-479bae5019e5"

# Per-IP limit for public sponsored-campaign impression/click events.
[[unsafe.bindings]]
