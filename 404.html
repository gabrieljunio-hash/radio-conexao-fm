<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#17213A">
<title>Página não encontrada | Conexão FM</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f4ef;color:#17213a;font:16px/1.6 system-ui,-apple-system,sans-serif}.card{width:min(520px,100%);padding:32px;border:1px solid #17213a20;border-radius:20px;background:#fff;box-shadow:0 12px 36px #17213a0c;text-align:center}.brand{color:#e66b55;font-weight:800;letter-spacing:.05em;font-size:13px}h1{font-size:26px;line-height:1.2;margin:16px 0 8px}p{color:#59657c}.link{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 18px;border-radius:12px;background:#17213a;color:#fff;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<main class="card">
<div class="brand">CONEXÃO FM</div>
<h1>Esta página não foi encontrada</h1>
<p>O endereço pode ter mudado ou a rádio não está mais disponível no catálogo.</p>
<a class="link" href="/">Voltar ao início</a>
</main>
<script>
(function(){
 const match=location.pathname.match(/^\/radio\/([a-z0-9-]{1,70})\/?$/i);
 if(match)location.replace("/radio.html?station="+encodeURIComponent(match[1]));
})();
</script>
</body>
